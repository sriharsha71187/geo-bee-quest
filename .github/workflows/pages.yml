# Deploys GeoBee Quest to GitHub Pages.
# The site is served from the gh-pages branch (Settings → Pages shows it as
# the source); this workflow mirrors main → gh-pages on every push, so a
# push to main is all it takes to update the live site.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Never deploy content that breaks a question, drops a fact id (which
      # would orphan the child's saved progress), or has a syntax error.
      - name: Validate content and engine
        run: |
          for f in js/*.js; do node --check "$f"; done
          node tools/validate.js
      - name: Publish main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:gh-pages
